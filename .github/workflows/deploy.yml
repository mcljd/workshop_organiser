name: Deploy to GitHub Pages

# Builds the Vite app and publishes it to GitHub Pages so there is a live,
# viewable link. Runs on pushes to the development branch and on demand.
on:
  push:
    branches: ['claude/pensive-faraday-StPe5']
  workflow_dispatch:

# Permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer runs supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:pages

      # Reads the Pages config. (Pages must be enabled once in repo
      # Settings -> Pages -> Source: "GitHub Actions".)
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
